name: Build and Push Docker Image to GitHub Package

on:
    push:
        branches:
            - karsajobs-ui
        paths:
            - 'src/**'
            - 'public/**'
            - 'Dockerfile'
            - 'package.json'
            - 'package-lock.json'
            - '.github/workflows/integration.yml'
    pull_request:
        branches:
            - karsajobs-ui
        paths:
            - 'src/**'
            - 'public/**'
            - 'Dockerfile'
            - 'package.json'
            - 'package-lock.json'

jobs:
  lint-dockerfile:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install hadolint
      - name: Install hadolint
        run: |
          curl -L https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64 -o hadolint
          chmod +x hadolint
          sudo mv hadolint /usr/local/bin/

      # Step 3: Run hadolint on Dockerfile
      - name: Lint Dockerfile
        run: hadolint Dockerfile

  build-app-karsajobs-ui:
    runs-on: ubuntu-latest
    needs: lint-dockerfile
    
    permissions:
      contents: read
      packages: write

    steps:
      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Login to GitHub Container Registry
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: Make script executable
      - name: Make script executable
        run: chmod +x ./build_push_image_karsajobs_ui.sh

      # Step 4: Run build and push script
      - name: Build and Push Docker Image
        env:
          IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
          IMAGE_TAG: ${{ secrets.IMAGE_TAG }}
        run: ./build_push_image_karsajobs_ui.sh

