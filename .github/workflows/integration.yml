name: Build and Push Docker Image to GitHub Package

on:
  push:
    branches:
      - karsajobs
    paths:
      - 'cmd/**'
      - 'pkg/**'
      - 'Dockerfile'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/integration.yml'
  pull_request:
    branches:
      - karsajobs
    paths:
      - 'cmd/**'
      - 'pkg/**'
      - 'Dockerfile'
      - 'go.mod'
      - 'go.sum'

jobs:
  lint-dockerfile:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install hadolint
      - name: Install hadolint
        run: |
          mkdir -p /tmp/hadolint
          curl -L https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64 -o /tmp/hadolint/hadolint
          chmod +x /tmp/hadolint/hadolint
          echo "/tmp/hadolint" >> $GITHUB_PATH

      # Step 3: Run hadolint on Dockerfile
      - name: Lint Dockerfile
        run: hadolint Dockerfile

  test-app:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Go
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.15'

      # Step 3: Run unit tests
      - name: Run unit tests
        run: go test -v -short --count=1 $(go list ./...)

  build-app-karsajobs:
    runs-on: ubuntu-latest
    needs: [lint-dockerfile, test-app]
    
    permissions:
      contents: read
      packages: write

    steps:
      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Login to GitHub Container Registry
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: Make script executable
      - name: Make script executable
        run: chmod +x ./build_push_image_karsajobs.sh

      # Step 4: Run build and push script
      - name: Build and Push Docker Image
        env:
          IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
          IMAGE_TAG: ${{ secrets.IMAGE_TAG }}
        run: ./build_push_image_karsajobs.sh

